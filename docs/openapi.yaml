            properties:
              id: { type: string }
              merchant_id: { type: string }
              merchant: { type: string }
              account_id: { type: string }
              currency: { type: string }
              statement_date: { type: string, format: date }
              settlement: { enum: [pending, settled] }
              withdrawal: { enum: [not_reported, pending, completed, failed] }
              statement_gross_minor: { type: string }
              statement_fee_minor: { type: string }
              statement_net_minor: { type: string }
              rows: { type: integer }
              differences: { type: integer }
