              merchant_id: { type: string }
              merchant: { type: string }
              merchant_reference: { type: string }
              currency: { type: string }
              amount_minor: { type: string }
              status: { enum: [draft, processing, pending_confirmation, succeeded, failed, rejected] }
              created_at: { type: string, format: date-time }
        settlements:
          type: array
          maxItems: 100
          items:
            type: object
