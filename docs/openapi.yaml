        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sandbox/workspace/settlement/{account}/{currency}/orders/{kind}:
    servers:
    - url: /
    parameters:
    - name: account
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    - name: currency
      in: path
