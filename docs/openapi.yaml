        resource_id: { type: string }
        details: { type: object }
        account_id: { $ref: '#/components/schemas/Reference' }
        platform_channel_id: { $ref: '#/components/schemas/Reference' }
        platform_channel_name: { type: string }
        provider: { $ref: '#/components/schemas/MockProvider' }
    PlatformMerchant:
