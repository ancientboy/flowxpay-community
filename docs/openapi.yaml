openapi: 3.1.0
info:
  title: FlowXPay Merchant API
  version: 0.7.0
  description: Local sandbox contract for merchant collections, payouts and settlement. All funds and channel actions are simulated.
externalDocs:
  description: Merchant sandbox integration guide
  url: merchant-api.md

servers:
  - url: /v1
security:
  - SandboxKey: []
paths:
  /capabilities:
    get:
      operationId: listCapabilities
      summary: Read enabled sandbox methods for the authenticated merchant
      responses:
        '200':
          description: Merchant and enabled methods
          content:
            application/json:
              schema:
                type: object
                required: [environment, capability_version, merchant, payments, sites]
                properties:
                  environment: { const: sandbox }
                  capability_version: { const: sandbox-collections-v1 }
                  request_signing_required: { type: boolean, description: Whether payment creation and refunds require Ed25519 request signatures. }
                  merchant:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
                  payments:
                    description: Eligible payment methods for the default site.
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }
                  sites:
                    type: array
                    items: { $ref: '#/components/schemas/SiteCapability' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payments:
    get:
      operationId: listPayments
      summary: List up to 100 recent payments for the authenticated merchant
      parameters:
        - name: merchant_reference
          in: query
          description: Optional exact match to recover an existing payment by merchant reference
          schema: { $ref: '#/components/schemas/Reference' }
      responses:
        '200':
          description: Recent payments or the exact matching reference
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayment
      summary: Reserve a payment on one sandbox channel account and return the current order state
      parameters:
        - { name: FlowXPay-Key-ID, in: header, required: false, description: Required for enrolled signed merchants., schema: { $ref: '#/components/schemas/Reference' } }
        - { name: FlowXPay-Request-Timestamp, in: header, required: false, description: Required for enrolled signed merchants. UTC Unix seconds within 300 seconds., schema: { type: string, pattern: '^[0-9]+$' } }
        - { name: FlowXPay-Request-Nonce, in: header, required: false, description: Required for enrolled signed merchants. Unique per merchant and request., schema: { type: string, pattern: '^[A-Za-z0-9_-]{22,64}$' } }
        - { name: FlowXPay-Request-Signature, in: header, required: false, description: Required for enrolled signed merchants. Ed25519 unpadded Base64URL., schema: { type: string, pattern: '^[A-Za-z0-9_-]{86}$' } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { $ref: '#/components/schemas/Reference' }
          description: Reuse this key for the same request until its result is known.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
            examples:
              brazilPix:
                value: { merchant_reference: 'BR-DEMO-01', market: BR, currency: BRL, method: pix, amount_minor: 129000 }
              usCard:
                value: { merchant_reference: 'US-DEMO-01', market: US, currency: USD, method: card, amount_minor: 24900 }
              indiaGateway:
                value: { merchant_reference: 'IN-DEMO-01', market: IN, currency: INR, method: gateway, amount_minor: 24900 }
      responses:
        '201':
          description: Payment reserved. Inspect status and failure_code before using any action.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: Idempotent replay. Returns the current state of the original payment.
          headers:
            Idempotency-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429':
          description: Local account budget exhausted before dispatch. Retry using the original key.
          headers:
            Retry-After:
              schema: { type: integer, const: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payments/{id}:
    get:
      operationId: getPayment
      summary: Read a payment belonging to the authenticated merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payments/{id}/refunds:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listPaymentRefunds
      summary: List up to 100 recent refunds for the authenticated merchant's payment
      responses:
        '200':
          description: Refund records with their own state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createRefund
      summary: Reserve a simulated refund against the original paid transaction and account
      parameters:
        - { name: FlowXPay-Key-ID, in: header, required: false, description: Required for enrolled signed merchants., schema: { $ref: '#/components/schemas/Reference' } }
        - { name: FlowXPay-Request-Timestamp, in: header, required: false, description: Required for enrolled signed merchants. UTC Unix seconds within 300 seconds., schema: { type: string, pattern: '^[0-9]+$' } }
        - { name: FlowXPay-Request-Nonce, in: header, required: false, description: Required for enrolled signed merchants. Unique per merchant and request., schema: { type: string, pattern: '^[A-Za-z0-9_-]{22,64}$' } }
        - { name: FlowXPay-Request-Signature, in: header, required: false, description: Required for enrolled signed merchants. Ed25519 unpadded Base64URL., schema: { type: string, pattern: '^[A-Za-z0-9_-]{86}$' } }
        - name: Idempotency-Key
          in: header
          required: true
          description: Keep the same key, payment and amount until the original refund is identified.
          schema: { $ref: '#/components/schemas/Reference' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, minimum: 1, maximum: 999999999999 }
      responses:
        '201':
          description: Reserved refund. Inspect its current status.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '200':
          description: Current state of the originally reserved refund
          headers:
            Idempotency-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Conflicting key, unavailable original transaction, or cumulative balance exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429':
          description: Original channel account rate limit reached before reservation committed
          headers:
            Retry-After:
              schema: { type: string, const: '1' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /refunds/{id}:
    get:
      operationId: getRefund
      summary: Read a refund independently of its payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Refund state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /collection-exceptions:
    get:
      operationId: listCollectionExceptions
      summary: List up to 100 recent collection exceptions for the authenticated merchant
      responses:
        '200':
          description: Pending confirmations, contradictory callbacks, replay conflicts and failed Webhook deliveries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectionException' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payout-accounts:
    get:
      operationId: listPayoutAccounts
      security: [{ WorkspaceSession: [] }]
      summary: Read available, reserved and per-order limits by provisioned sandbox account
      responses:
        '200':
          description: Merchant-owned sandbox payout accounts and their limits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayoutAccount' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payout-recipients:
    get:
      operationId: listPayoutRecipients
      security: [{ WorkspaceSession: [] }]
      summary: List masked recipients in the workspace
      responses:
        '200':
          description: Masked recipients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayoutRecipient' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayoutRecipient
      security: [{ WorkspaceSession: [] }]
      summary: Create a fictional recipient as an operator or admin
      parameters:
        - $ref: '#/components/parameters/PayoutIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, test_suffix]
              properties:
                type: { $ref: '#/components/schemas/PayoutRecipientType' }
                test_suffix: { type: string, pattern: '^[0-9]{4}$', description: Four invented digits for display. }
      responses:
        '200': { $ref: '#/components/responses/PayoutRecipient' }
        '201': { $ref: '#/components/responses/PayoutRecipient' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payouts:
    get:
      operationId: listPayouts
      security: [{ WorkspaceSession: [] }]
      summary: List up to 100 recent workspace payouts or search by full order number
      parameters:
        - name: reference
          in: query
          description: Case-sensitive exact match against either the platform payout ID or the merchant reference. If both filters are supplied, both must match.
          schema: { $ref: '#/components/schemas/Reference' }
        - name: merchant_reference
          in: query
          description: Case-sensitive exact match against the merchant reference.
          schema: { $ref: '#/components/schemas/Reference' }
      responses:
        '200':
          description: Workspace payouts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payout' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayoutDraft
      security: [{ WorkspaceSession: [] }]
      summary: Create a draft as an operator or admin without reserving funds
      parameters:
        - $ref: '#/components/parameters/PayoutIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PayoutRequest'
              unevaluatedProperties: false
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '201': { $ref: '#/components/responses/Payout' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422':
          description: Account, recipient type, currency or amount is ineligible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payouts/{id}:
    parameters:
      - $ref: '#/components/parameters/PayoutID'
    get:
      operationId: getPayout
      security: [{ WorkspaceSession: [] }]
      summary: Read the current payout and review state
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payouts/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PayoutID'
    post:
      operationId: approvePayout
      security: [{ WorkspaceSession: [] }]
      summary: A different admin approves the draft and atomically reserves the original account's funds
      description: >
        The sandbox worker checks the original account's rolling one-second dispatch limit and
        UTC daily quota before submission. A limit failure releases the funds reservation and is
        visible on the payout. Repeating the same decision as the recorded reviewer returns the current payout.
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payouts/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/PayoutID'
    post:
      operationId: rejectPayout
      security: [{ WorkspaceSession: [] }]
      summary: A different admin rejects the draft before submission
      description: Repeating the same decision as the recorded reviewer returns the current payout.
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/api-keys:
    servers: [{ url: / }]
    get:
      operationId: listWorkspaceAPIKeys
      security: [{ WorkspaceSession: [] }]
      summary: List key metadata and audit history for the current merchant (admin)
      description: >
        Legacy credentials appear as metadata. Managed key digests and plaintext secrets are excluded.
      responses:
        '200':
          description: Current merchant resource list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceAPIKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWorkspaceAPIKey
      security: [{ WorkspaceSession: [] }]
      deprecated: true
      summary: Reject standalone merchant key issuance
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/api-keys/{id}/rotate:
    servers: [{ url: / }]
    parameters: [{ $ref: '#/components/parameters/WorkspaceControlID' }]
    post:
      operationId: rotateWorkspaceAPIKey
      security: [{ WorkspaceSession: [] }]
      summary: Rotate an active merchant-managed key (admin)
      description: >
        Atomically retires the current key and returns a replacement secret once.
        Omit the label to retain the current label. Platform-issued keys are managed by platform operators.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Replacement key and one-time secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedWorkspaceAPIKey' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/api-keys/{id}/revoke:
    servers: [{ url: / }]
    parameters: [{ $ref: '#/components/parameters/WorkspaceControlID' }]
    post:
      operationId: revokeWorkspaceAPIKey
      security: [{ WorkspaceSession: [] }]
      summary: Revoke a merchant-managed key (admin)
      description: Repeating a revocation returns the original retirement metadata.
      responses:
        '200':
          description: Revoked key metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAPIKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/route-changes:
    servers: [{ url: / }]
    get:
      operationId: listCollectionRouteChanges
      security: [{ WorkspaceSession: [] }]
      summary: List collection routing changes and audit history
      description: >
        Available to admins, operators and viewers within their merchant.
      responses:
        '200':
          description: Current merchant resource list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CollectionRouteChange' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: submitCollectionRouteChange
      security: [{ WorkspaceSession: [] }]
      deprecated: true
      summary: Reject legacy merchant write
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/route-changes/{id}/approve:
    servers: [{ url: / }]
    parameters: [{ $ref: '#/components/parameters/WorkspaceControlID' }]
    post:
      operationId: approveCollectionRouteChange
      security: [{ WorkspaceSession: [] }]
      deprecated: true
      summary: Reject legacy merchant write
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sandbox/ops/merchants:
    servers: [{ url: / }]
    get:
      operationId: listPlatformMerchants
      summary: Search the sandbox merchant directory by name or ID
      security: [{ PlatformSession: [] }]
      parameters:
        - name: q
          in: query
          description: Case-insensitive literal substring of the merchant name or ID.
          schema: { type: string, maxLength: 100 }
        - name: after
          in: query
          description: Use next_after from the preceding page with the same search.
          schema: { $ref: '#/components/schemas/Reference' }
      responses:
        '200':
          description: At most 100 matching merchants, ordered by ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformMerchantPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: onboardPlatformMerchant
      summary: Open a sandbox merchant with its default site, first administrator invitation and initial API key
      security: [{ PlatformSession: [] }]
      description: >
        Requires a platform operator. The merchant, site, invitation, platform-managed sandbox API key and
        audit records commit together. The invitation link and key secret are only returned in the initial 201.
        The invitation expires after 24 hours. The operator shares the returned link manually.
        Optional site and administrator names default to the normalized merchant name and email local part.
        Retry with the original key and input if the result is unknown.
      parameters:
        - $ref: '#/components/parameters/OnboardingIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformOnboardingInput' }
      responses:
        '200':
          description: Identical replay with current safe onboarding metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOnboarding' }
        '201':
          description: Committed onboarding with the one-time invitation link and sandbox API key secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedPlatformOnboarding' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/ops/merchants/{merchant}/admin-invitation:
    servers: [{ url: / }]
    post:
      operationId: reissuePlatformAdminInvitation
      summary: Replace a lost or expired first administrator invitation
      security: [{ PlatformSession: [] }]
      description: >
        Requires a platform operator and the current invite_version from merchant-scoped operations.
        A replacement invalidates the previous link in the same transaction and uses the original
        administrator identity. An accepted invitation or stale version returns HTTP 409.
        Identical replays expose current metadata only, with no invitation link.
      parameters:
        - name: merchant
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Reference' }
        - $ref: '#/components/parameters/OnboardingIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invite_version]
              properties:
                invite_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Identical replay with current safe onboarding metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOnboarding' }
        '201':
          description: Committed replacement and its one-time invitation link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedPlatformAdminInvitation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/ops/dashboard:
    servers: [{ url: / }]
    get:
      operationId: getPlatformDashboard
      summary: Read the platform overview and optionally its collection setup tasks
      security: [{ PlatformSession: [] }]
      parameters:
        - name: merchant
          in: query
          schema: { $ref: '#/components/schemas/Reference' }
        - name: reference
          in: query
          description: Filter the collection orders by exact platform payment ID or merchant reference, within the selected merchant if supplied.
          schema: { $ref: '#/components/schemas/Reference' }
        - name: tasks
          in: query
          description: Set to 1 to include scoped site cards, task counts and the first ten entries per group.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Platform dashboard with role-aware task groups when requested.
          content:
            application/json:
              schema:
                type: object
                required: [merchants, volumes, payments, channels]
                properties:
                  merchants: { type: array, items: { $ref: '#/components/schemas/PlatformMerchant' } }
