<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="Try FlowXPay's multi-country payment sandbox and explore its channel catalog.">
  <title>FlowXPay Community Demo</title>
  <link rel="stylesheet" href="./demo.css">
  <script src="./demo.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#channels">FlowX<span>Pay</span></a>
      <span class="demo-label" data-copy="community">Community demo</span>
      <div class="topbar-actions">
        <a href="https://github.com/ancientboy/flowxpay-community">GitHub</a>
        <label class="visually-hidden" for="language" data-copy="language">Language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
        </select>
      </div>
    </div>
  </header>
  <div class="shell">
    <nav id="navigation" aria-label="Demo pages">
      <a href="#channels" data-view="channels" data-copy="channels">Channels</a>
      <a href="#orders" data-view="orders" data-copy="orders">Merchant orders</a>
      <a href="#checkout" data-view="checkout" data-copy="checkout">Checkout</a>
    </nav>
    <main id="main" tabindex="-1">
      <noscript>This demo needs JavaScript for local payment simulation. Explore the source and setup guide on GitHub.</noscript>
    </main>
    <footer class="footer">
      <span data-copy="footer">FlowXPay Community · Sample data only</span>
      <a href="https://t.me/FlowXPay_nova" data-copy="contact">Contact us on Telegram</a>
    </footer>
  </div>
  <div id="announcement" class="visually-hidden" role="status"></div>
</body>
</html>
