      properties:
        id: { type: string }
        payment_id: { type: string }
        currency: { enum: [USD, BRL, INR] }
        amount_minor: { type: integer, minimum: 1, maximum: 999999999999 }
        status: { enum: [pending_confirmation, succeeded, failed] }
        failure_code: { enum: [channel_confirmation_pending, channel_rejected, channel_rate_limited] }
