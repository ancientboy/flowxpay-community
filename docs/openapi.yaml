        channels:
          type: array
          items: { $ref: '#/components/schemas/PlatformChannel' }
        upstream_integrations:
          type: array
          description: Platform-wide production onboarding records, not routable accounts.
          items: { $ref: '#/components/schemas/UpstreamIntegration' }
        audit:
          type: array
          items: { $ref: '#/components/schemas/PlatformAudit' }
        merchant_channel_quotes:
          description: Available collection routes and enabled payout account prices for the selected merchant. Each quote reflects the effective default or merchant override.
          $ref: '#/components/schemas/MerchantChannelQuotes'
        accounts:
          type: array
          items: { $ref: '#/components/schemas/PlatformAssignment' }
        routes:
          type: array
          items: { $ref: '#/components/schemas/CollectionRouteChange' }
        effective_routes:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Capability'
              - type: object
                required: [site_id, account_id]
                properties:
                  site_id: { $ref: '#/components/schemas/Reference' }
                  account_id: { $ref: '#/components/schemas/Reference' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceAPIKey' }
        sites:
          type: array
          items: { $ref: '#/components/schemas/SiteCard' }
    SiteCard:
      type: object
      required: [id, name, is_default, business_domain, merchant_id, merchant_name, assigned_accounts, available_accounts, methods, proposals]
      properties:
        id: { $ref: '#/components/schemas/Reference' }
        name: { type: string }
        is_default: { type: boolean }
        business_domain: { type: [string, 'null'], description: Optional display-only DNS name. }
        merchant_id: { $ref: '#/components/schemas/Reference' }
        merchant_name: { type: string }
        assigned_accounts: { type: integer, minimum: 0 }
        available_accounts: { type: integer, minimum: 0 }
        methods:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        proposals:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Capability'
              - type: object
                required: [available]
                properties:
                  available: { type: boolean }
    RouteSnapshot:
      type: object
      required: [capability_version, environment, site_id, account_id, provider, requests_per_second, capability]
      properties:
        platform_channel_id: { $ref: '#/components/schemas/Reference' }
        capability_version: { type: string }
        environment: { const: sandbox }
        site_id: { $ref: '#/components/schemas/Reference' }
        account_id: { $ref: '#/components/schemas/Reference' }
        route_change_id: { $ref: '#/components/schemas/Reference' }
        provider: { $ref: '#/components/schemas/MockProvider' }
        requests_per_second: { type: integer }
        capability: { $ref: '#/components/schemas/Capability' }
    PaymentRequest:
      allOf:
        - $ref: '#/components/schemas/Capability'
        - type: object
          required: [merchant_reference, amount_minor]
          properties:
            merchant_reference: { $ref: '#/components/schemas/Reference' }
            amount_minor: { type: integer, minimum: 1, maximum: 999999999999 }
            site_id:
              description: Omit to use the merchant's default site.
              $ref: '#/components/schemas/Reference'
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentRequest'
        - type: object
          required: [id, status, created_at, expires_at]
          properties:
            id: { type: string }
            status: { enum: [requires_action, succeeded, expired, pending_confirmation, failed] }
            created_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            paid_at: { type: string, format: date-time }
            checkout_path:
              type: string
              format: uri-reference
              deprecated: true
            checkout_url:
              description: Same-origin path to the FlowXPay checkout on the sandbox web origin.
              type: string
              format: uri-reference
            failure_code:
              enum: [channel_confirmation_pending, channel_action_unsupported, channel_rejected, channel_rate_limited]
            route_snapshot:
              description: Route saved at order creation. Older sandbox orders can omit this field.
              $ref: '#/components/schemas/RouteSnapshot'
            next_action: { $ref: '#/components/schemas/NextAction' }
            quote: { anyOf: [{ $ref: '#/components/schemas/MerchantOrderFee' }, { type: 'null' }] }
    NextAction:
      oneOf:
        - type: object
          required: [type, url]
          properties:
            type: { const: redirect }
            url: { type: string, format: uri-reference }
        - type: object
          required: [type, qr_payload, qr_image_url]
          properties:
            type: { const: display_qr }
            qr_payload: { type: string }
            qr_image_url: { type: string, format: uri-reference }
        - type: object
          required: [type]
          properties:
            type: { const: unsupported }
