            Content-Disposition:
              schema:
                type: string
            X-Next-After:
              description: Cursor for the following page, when available.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sandbox/workspace/settlement/{account}/{currency}/entries/{entry}/actions:
    servers:
    - url: /
    parameters:
    - name: account
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    - name: currency
      in: path
      required: true
      schema:
        type: string
        enum:
        - USD
        - BRL
        - INR
    - name: entry
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    get:
      operationId: listSettlementActions
      summary: Read revision history for one entry
      security:
      - WorkspaceSession: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
      responses:
        '200':
          description: Actions and their before-and-after checks
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettlementAction'
                    maxItems: 100
                  next_after:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: recordSettlementAction
      summary: Acknowledge, reopen or recheck a difference
      security:
      - WorkspaceSession: []
      description: Operator or admin. Provide the current revision. Each accepted action adds a durable audit
        entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementActionInput'
      responses:
        '200':
          description: Latest entry revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sandbox/workspace/setup:
    servers: [{ url: / }]
    get:
      operationId: getWorkspaceCollectionSetup
      security: [{ WorkspaceSession: [] }]
      summary: Read enabled collection currencies and the latest order currency for the signed-in merchant
      responses:
        '200':
          description: The latest order currency is null until the merchant has an order. Accounts reflect the routes available for new orders.
          content:
            application/json:
              schema:
                type: object
                required: [recent_currency, open_currencies, effective_account_ids, sites]
                properties:
                  recent_currency: { type: [string, 'null'], enum: [USD, BRL, INR, null] }
                  open_currencies: { type: array, uniqueItems: true, items: { type: string, enum: [USD, BRL, INR] } }
                  sites: { type: array, items: { $ref: '#/components/schemas/SiteCard' } }
                  effective_account_ids: { type: array, items: { $ref: '#/components/schemas/Reference' } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/settlement-summary:
    servers: [{ url: / }]
    get:
      operationId: getWorkspaceSettlementSummary
      security: [{ WorkspaceSession: [] }]
      summary: Aggregate imported statement net by currency and settlement status for the signed-in merchant
      description: Includes all recorded batches. An absent status has a null net. The latest settled statement date is the statement date.
      responses:
        '200':
          description: One row per currency with imported statements.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [currency, pending_net_minor, settled_net_minor, latest_settled_statement_date, statement_account_id]
                  properties:
                    currency: { type: string, enum: [USD, BRL, INR] }
                    pending_net_minor: { type: [string, 'null'], pattern: '^-?[0-9]+$' }
                    settled_net_minor: { type: [string, 'null'], pattern: '^-?[0-9]+$' }
                    latest_settled_statement_date: { type: [string, 'null'], format: date }
                    statement_account_id: { $ref: '#/components/schemas/Reference' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/overview:
    servers: [{ url: / }]
    get:
      operationId: getWorkspaceOverview
      security: [{ WorkspaceSession: [] }]
      summary: Read merchant-wide collection and settled statement totals for one currency
      description: Collection totals use order creation date, and settled totals use statement date, inclusive in UTC.
      parameters:
        - name: currency
          in: query
          required: true
          schema: { type: string, enum: [USD, BRL, INR] }
        - name: days
          in: query
          required: true
          schema: { type: integer, enum: [7, 30] }
      responses:
        '200':
          description: Totals in currency minor units. Settlement amounts are null when no settled statements exist.
          content:
            application/json:
              schema:
                type: object
                required: [orders, paid_orders, gross_minor, fees_minor, settled_net_minor]
                properties:
                  orders: { type: integer }
                  paid_orders: { type: integer }
                  gross_minor: { type: string }
                  fees_minor: { type: [string, 'null'] }
                  settled_net_minor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/payments:
    servers: [{ url: / }]
    get:
      operationId: listWorkspacePayments
      security: [{ WorkspaceSession: [] }]
      summary: List the signed-in merchant's payments without an API key
      parameters:
        - name: reference
          in: query
          description: Exact merchant reference or platform order ID.
          schema: { type: string }
        - name: recent
          in: query
          description: Send 1 to limit the list to six instead of 100.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Recent payments. Viewer sessions omit checkout links and actions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/chargebacks:
    servers: [{ url: / }]
    get:
      operationId: listSandboxChargebacks
      security: [{ WorkspaceSession: [] }]
      summary: List the latest 100 sandbox chargebacks belonging to the workspace merchant
      responses:
        '200':
          description: Chargebacks ordered by most recent status change
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SandboxChargeback' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/workspace/chargebacks/{account}/{id}:
    servers: [{ url: / }]
    get:
      operationId: getSandboxChargeback
      security: [{ WorkspaceSession: [] }]
      summary: Read an account-scoped chargeback, original order and callback history
      parameters:
        - name: account
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Reference' }
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Reference' }
      responses:
        '200':
          description: Sandbox chargeback, paid order summary and recorded events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxChargebackDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sandbox/channel-callbacks/{account}:
    servers:
      - url: /
    post:
      security: []
      operationId: receiveSandboxChannelCallback
      summary: Accept an authenticated, account-scoped mock channel event
      description: >-
        Chargeback events reference the original paid order in subject_id, use its original channel reference
        and currency, and share an immutable amount and order per account and chargeback_id.
        The first won or lost observation is final, including when it precedes opened.
        Chargebacks record channel observations without posting funds or changing the payment.
      parameters:
        - name: account
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Reference' }
        - name: FlowXPay-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: FlowXPay-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, kind, subject_id, channel_reference, status, currency, amount_minor]
              properties:
                event_id: { $ref: '#/components/schemas/Reference' }
                kind: { enum: [payment, refund, payout, chargeback] }
                chargeback_id: { $ref: '#/components/schemas/Reference' }
                subject_id: { $ref: '#/components/schemas/Reference' }
                channel_reference: { $ref: '#/components/schemas/Reference' }
                status: { type: string }
                currency: { enum: [USD, BRL, INR] }
                amount_minor: { type: integer, minimum: 1 }
                transfer_reference:
                  $ref: '#/components/schemas/Reference'
              allOf:
                - if:
                    properties:
                      kind: { const: payout }
                      status: { const: succeeded }
                  then:
                    required: [transfer_reference]
                  else:
                    properties:
                      transfer_reference: false
                - if:
                    properties:
                      kind: { const: chargeback }
                  then:
                    required: [chargeback_id]
                    properties:
                      status: { $ref: '#/components/schemas/SandboxChargebackStatus' }
                  else:
                    properties:
                      chargeback_id: false
                      status: { enum: [pending, succeeded, failed] }
      responses:
        '200':
          description: Committed processing result
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                properties:
                  outcome: { enum: [applied, ignored, duplicate, terminal_conflict] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
webhooks:
  terminalBusinessEvent:
    post:
      security: []
      summary: Deliver a terminal payment, refund or payout event to an allowed local mock receiver
      parameters:
        - name: FlowXPay-Event-ID
          in: header
          required: true
          schema: { type: string }
        - name: FlowXPay-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: FlowXPay-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CollectionEvent'
                - $ref: '#/components/schemas/PayoutEvent'
      responses:
        '2XX':
          description: Receipt acknowledged. Deduplicate using the event ID.
components:
  securitySchemes:
    PlatformSession:
      type: http
      scheme: bearer
      description: Independent local sandbox platform session issued by /sandbox/ops/login.
    SandboxKey:
      type: http
      scheme: bearer
      description: >-
        Send the managed sandbox API key in Authorization as a Bearer credential.
        The API derives the merchant from the key. Enrolled sandbox merchants also sign payment creation and refunds.
        The original sandbox environment key remains valid until explicitly retired.
    WorkspaceSession:
      type: http
      scheme: bearer
      description: Active sandbox member session, subject to current membership role and MFA policy.
  parameters:
    OnboardingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: '#/components/schemas/Reference' }
      description: Keep the same key and input for retries. Different input with the same key conflicts.
    WorkspaceControlID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Reference' }
    PayoutIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: '#/components/schemas/Reference' }
      description: Reuse the same key with the same input when retrying.
    PayoutID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Reference' }
  responses:
    Payout:
      description: Current sandbox payout
      headers:
        Location:
          description: Payout resource URI, returned for draft creation and identical replay.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Payout' }
    PayoutRecipient:
      description: Current masked sandbox recipient
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayoutRecipient' }
    Error:
      description: Stable machine-readable API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SandboxChargebackStatus:
      enum: [opened, won, lost]
    SandboxChargeback:
      type: object
      required: [id, account_id, payment_id, merchant_reference, status, currency, amount_minor, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Reference' }
        account_id: { $ref: '#/components/schemas/Reference' }
        payment_id: { $ref: '#/components/schemas/Reference' }
        merchant_reference: { $ref: '#/components/schemas/Reference' }
        status: { $ref: '#/components/schemas/SandboxChargebackStatus' }
        currency: { enum: [USD, BRL, INR] }
        amount_minor: { type: integer, minimum: 1, maximum: 999999999999 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SandboxChargebackDetail:
      allOf:
        - $ref: '#/components/schemas/SandboxChargeback'
        - type: object
          required: [payment, history]
          properties:
            payment:
              type: object
              required: [status, amount_minor, paid_at, channel_reference]
              properties:
                status: { const: succeeded }
                amount_minor: { type: integer, minimum: 1, maximum: 999999999999 }
                paid_at: { type: string, format: date-time }
                channel_reference: { $ref: '#/components/schemas/Reference' }
            history:
              type: array
              minItems: 1
              items:
                type: object
                required: [event_id, status, outcome, received_at, replay_conflict_at]
                properties:
                  event_id: { $ref: '#/components/schemas/Reference' }
                  status: { $ref: '#/components/schemas/SandboxChargebackStatus' }
                  outcome: { enum: [applied, ignored, terminal_conflict] }
                  received_at: { type: string, format: date-time }
                  replay_conflict_at: { type: [string, 'null'], format: date-time }
    SettlementStatementRow:
      type: object
      required:
      - id
      - kind
      - channel_reference
      - gross_minor
      - fee_minor
      - net_minor
      properties:
        id:
          $ref: '#/components/schemas/Reference'
        kind:
          enum:
          - collection
          - refund
          - payout
          - reversal
        channel_reference:
          $ref: '#/components/schemas/Reference'
        reverses_entry:
          $ref: '#/components/schemas/Reference'
        gross_minor:
          type: integer
          minimum: -999999999999
          maximum: 999999999999
        fee_minor:
          type: integer
          minimum: -999999999999
          maximum: 999999999999
        net_minor:
          type: integer
          minimum: -999999999999
          maximum: 999999999999
      additionalProperties: false
    SettlementStatement:
      type: object
      required:
      - id
      - statement_date
      - settlement_status
      - withdrawal_status
      - entries
      properties:
        id:
          $ref: '#/components/schemas/Reference'
        statement_date:
          type: string
          format: date
        settlement_status:
          enum:
          - pending
          - settled
        withdrawal_status:
          enum:
          - not_reported
          - pending
          - completed
          - failed
        withdrawal_reference:
          type: string
          pattern: ^([a-zA-Z0-9._:-]{1,80})?$
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SettlementStatementRow'
      additionalProperties: false
      if:
        properties:
          withdrawal_status: { const: not_reported }
      then:
        properties:
          withdrawal_reference: { const: '' }
      else:
        required: [withdrawal_reference]
        properties:
          withdrawal_reference: { minLength: 1 }
    SettlementImportResult:
      type: object
      required:
      - id
      - replayed
      properties:
        id:
          $ref: '#/components/schemas/Reference'
        replayed:
          type: boolean
    SettlementBatch:
      type: object
      required:
      - id
      - statement_date
      - settlement_status
      - withdrawal_status
      - account_id
      - currency
      - imported_by
      - imported_at
      - row_count
      - gross_minor
      - fee_minor
      - net_minor
      - calculated_net_minor
      properties:
        id:
          $ref: '#/components/schemas/Reference'
        statement_date:
          type: string
          format: date
        settlement_status:
          enum:
          - pending
          - settled
        withdrawal_status:
          enum:
          - not_reported
          - pending
          - completed
          - failed
        withdrawal_reference:
          type: string
          pattern: ^([a-zA-Z0-9._:-]{1,80})?$
        account_id:
          $ref: '#/components/schemas/Reference'
        currency:
          type: string
          enum:
          - USD
          - BRL
          - INR
        imported_by:
          type: string
        imported_at:
          type: string
          format: date-time
        row_count:
          type: integer
          minimum: 1
          maximum: 500
        gross_minor:
          type: integer
          format: int64
        fee_minor:
          type: integer
          format: int64
        net_minor:
          type: integer
          format: int64
        calculated_net_minor:
          type: integer
          format: int64
    SettlementEntry:
      type: object
      required:
      - id
      - kind
      - channel_reference
      - gross_minor
      - fee_minor
      - net_minor
      - calculated_net_minor
      - match_status
      - difference_status
      - acknowledged
      - revision
      properties:
        id:
          $ref: '#/components/schemas/Reference'
        kind:
          enum:
          - collection
          - refund
          - payout
          - reversal
        channel_reference:
          $ref: '#/components/schemas/Reference'
        reverses_entry:
          $ref: '#/components/schemas/Reference'
        gross_minor:
          type: integer
          minimum: -999999999999
          maximum: 999999999999
        fee_minor:
          type: integer
          minimum: -999999999999
          maximum: 999999999999
        net_minor:
          type: integer
          minimum: -999999999999
          maximum: 999999999999
        calculated_net_minor:
          type: integer
          format: int64
        order_id:
          type: string
        order_status:
          type: string
        expected_gross_minor:
          type: integer
          format: int64
        match_status:
          enum:
          - matched
          - missing
          - ambiguous
          - amount_mismatch
          - status_mismatch
        difference_status:
          enum:
          - matched
          - open
          - acknowledged
        acknowledged:
          type: boolean
        revision:
          type: integer
          minimum: 0
    SettlementBatchDetail:
      allOf:
      - $ref: '#/components/schemas/SettlementBatch'
      - type: object
        required:
        - entries
        properties:
          entries:
            type: array
            maxItems: 500
            items:
              $ref: '#/components/schemas/SettlementEntry'
    SettlementTotals:
      type: object
      required:
      - account_id
      - currency
      - from
      - through
      - batch_count
      - row_count
      - gross_minor
      - fee_minor
      - net_minor
      - calculated_net_minor
      properties:
        account_id:
          $ref: '#/components/schemas/Reference'
        currency:
          type: string
          enum:
          - USD
