      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        summary:
          type: array
          items:
            type: object
            required: [currency, direction, orders, succeeded, in_progress, successful_minor]
            properties:
              currency: { type: string }
              direction: { enum: [collection, payout] }
              orders: { type: integer }
              succeeded: { type: integer }
              in_progress: { type: integer }
              successful_minor: { type: string, pattern: '^[0-9]+$' }
