    PayoutRecipientType:
      enum: [bank_account, pix, upi]
    PayoutRecipient:
      type: object
      required: [id, type, masked_destination]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/PayoutRecipientType' }
        masked_destination: { type: string, example: '•••• 0427' }
    PayoutAccount:
      type: object
      required: [account_id, site_id, provider, currency, recipient_type, available_minor, reserved_minor, max_payout_minor, enabled]
      properties:
        account_id: { type: string }
        site_id: { type: string }
        provider: { enum: [mock_card, mock_pix, mock_in_redirect] }
        currency: { enum: [USD, BRL, INR] }
        recipient_type: { $ref: '#/components/schemas/PayoutRecipientType' }
        available_minor: { type: integer, minimum: 0 }
        reserved_minor: { type: integer, minimum: 0 }
        max_payout_minor: { type: integer, minimum: 1, maximum: 999999999999 }
        enabled: { type: boolean }
    FeeDirection:
      enum: [collection, payout]
    FeeCurrency:
      enum: [BRL, USD, INR]
    PricingAmount:
      type: integer
      minimum: 0
      maximum: 999999999999
    FeeVersion:
      type: object
      required: [bps, fixed_minor, version_id, source, effective_at]
      properties:
        bps: { type: integer, minimum: 0, maximum: 10000 }
        fixed_minor: { $ref: '#/components/schemas/PricingAmount' }
        version_id: { type: string, pattern: '^[0-9]+$' }
        source: { enum: [cost, default, override] }
        effective_at: { type: string, format: date-time }
    MerchantFeeVersion:
      allOf:
        - $ref: '#/components/schemas/FeeVersion'
        - properties:
            source: { enum: [default, override] }
    OrderFee:
      allOf:
        - $ref: '#/components/schemas/FeeVersion'
        - type: object
          required: [fee_minor]
          properties:
            fee_minor: { type: integer, minimum: 0, maximum: 1999999999998 }
    MerchantOrderFee:
      allOf:
        - $ref: '#/components/schemas/OrderFee'
        - $ref: '#/components/schemas/MerchantFeeVersion'
    PublishChannelPrice:
      type: object
      additionalProperties: false
      required: [direction, currency, kind]
      properties:
        direction: { $ref: '#/components/schemas/FeeDirection' }
        currency: { $ref: '#/components/schemas/FeeCurrency' }
        kind: { enum: [cost, default, override] }
        bps: { type: integer, minimum: 0, maximum: 10000 }
        fixed_minor: { $ref: '#/components/schemas/PricingAmount' }
        restore_default: { type: boolean }
      if:
        required: [restore_default]
        properties:
          restore_default: { const: true }
      then:
        properties:
          kind: { const: override }
          bps: false
          fixed_minor: false
      else:
        required: [bps, fixed_minor]
    PublishedPrice:
      type: object
      required: [direction, currency, kind, version_id, effective_at, restore_default]
      properties:
        direction: { $ref: '#/components/schemas/FeeDirection' }
        currency: { $ref: '#/components/schemas/FeeCurrency' }
        kind: { enum: [cost, default, override] }
        version_id: { type: string, pattern: '^[0-9]+$' }
        effective_at: { type: string, format: date-time }
        restore_default: { type: boolean }
    ChannelPrices:
      type: array
      items:
        type: object
        required: [channel_id, direction, currency, default, override]
        properties:
          channel_id: { $ref: '#/components/schemas/Reference' }
          direction: { $ref: '#/components/schemas/FeeDirection' }
          currency: { $ref: '#/components/schemas/FeeCurrency' }
          cost: { $ref: '#/components/schemas/FeeVersion' }
          default: { anyOf: [{ $ref: '#/components/schemas/MerchantFeeVersion' }, { type: 'null' }] }
          override: { anyOf: [{ $ref: '#/components/schemas/MerchantFeeVersion' }, { type: 'null' }] }
    MerchantChannelQuotes:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [account_id, site_id, provider, direction, currency, quote]
        properties:
          account_id: { $ref: '#/components/schemas/Reference' }
          site_id: { $ref: '#/components/schemas/Reference' }
          channel_id: { $ref: '#/components/schemas/Reference' }
          name: { type: string }
          provider: { type: string }
          direction: { $ref: '#/components/schemas/FeeDirection' }
          currency: { $ref: '#/components/schemas/FeeCurrency' }
          quote: { anyOf: [{ $ref: '#/components/schemas/MerchantFeeVersion' }, { type: 'null' }] }
    ConfirmCollectionSwitch:
      type: object
      additionalProperties: false
      required: [preview]
      properties:
        preview: { type: string, pattern: '^[0-9a-f]{64}$' }
    CollectionSwitchChannel:
      type: object
      required: [provider, available, quote]
      properties:
        channel_id: { $ref: '#/components/schemas/Reference' }
        account_id: { $ref: '#/components/schemas/Reference' }
        name: { type: string }
        provider: { type: string }
        available: { type: boolean }
        cost: { $ref: '#/components/schemas/FeeVersion' }
        quote: { anyOf: [{ $ref: '#/components/schemas/MerchantFeeVersion' }, { type: 'null' }] }
    CollectionSwitchPreview:
      allOf:
        - $ref: '#/components/schemas/Capability'
        - type: object
          required: [merchant_id, site_id, current, target, preview]
          properties:
            merchant_id: { $ref: '#/components/schemas/Reference' }
            site_id: { $ref: '#/components/schemas/Reference' }
            current_route_id: { $ref: '#/components/schemas/Reference' }
            current: { anyOf: [{ $ref: '#/components/schemas/CollectionSwitchChannel' }, { type: 'null' }] }
            target: { $ref: '#/components/schemas/CollectionSwitchChannel' }
            preview: { type: string, pattern: '^(|[0-9a-f]{64})$' }
    PlatformOrderFees:
      type: array
      items:
        type: object
        required: [id, status, site_id, account_id, direction, currency, amount_minor, created_at, quote, statement_fee_minor, statement_net_minor, statement_status]
        properties:
          id: { $ref: '#/components/schemas/Reference' }
          status: { type: string }
          site_id: { type: string }
          account_id: { type: string }
          channel_id: { $ref: '#/components/schemas/Reference' }
          direction: { $ref: '#/components/schemas/FeeDirection' }
          currency: { $ref: '#/components/schemas/FeeCurrency' }
          amount_minor: { $ref: '#/components/schemas/PricingAmount' }
          created_at: { type: string, format: date-time }
          quote: { anyOf: [{ $ref: '#/components/schemas/MerchantOrderFee' }, { type: 'null' }] }
          cost: { $ref: '#/components/schemas/OrderFee' }
          estimated_margin_minor: { type: integer }
          statement_fee_minor: { type: [integer, 'null'] }
          statement_net_minor: { type: [integer, 'null'] }
          statement_batch_id: { $ref: '#/components/schemas/Reference' }
          statement_status: { enum: [missing, reversal_reported, unmatched, pending, matched_settled] }
    PayoutRequest:
      type: object
      required: [merchant_reference, account_id, recipient_id, currency, amount_minor]
      properties:
        merchant_reference: { $ref: '#/components/schemas/Reference' }
        account_id: { $ref: '#/components/schemas/Reference' }
        recipient_id: { $ref: '#/components/schemas/Reference' }
        currency: { enum: [USD, BRL, INR] }
        amount_minor: { type: integer, minimum: 1, maximum: 999999999999 }
    Payout:
      allOf:
        - $ref: '#/components/schemas/PayoutRequest'
        - type: object
          required: [id, recipient_type, status, created_by, channel_reference, created_at, updated_at]
          properties:
            id: { type: string }
            recipient_type: { $ref: '#/components/schemas/PayoutRecipientType' }
            status: { enum: [draft, processing, pending_confirmation, succeeded, failed, rejected] }
            created_by: { type: string }
            reviewed_by: { type: string }
            reviewed_at: { type: string, format: date-time }
            channel_reference: { type: string, description: Reserved mock channel reference for the original account. }
            transfer_reference: { type: string, description: Simulated UTR or transfer reference on success. }
            failure_code: { enum: [review_rejected, channel_rejected, payout_account_disabled, payout_rate_limited, payout_daily_limit_exceeded] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            quote: { anyOf: [{ $ref: '#/components/schemas/MerchantOrderFee' }, { type: 'null' }] }
            platform_channel_id: { $ref: '#/components/schemas/Reference' }
    PayoutEvent:
      type: object
