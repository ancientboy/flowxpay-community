        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sandbox/workspace/settlement/{account}/{currency}/orders/{kind}/report.csv:
    servers:
