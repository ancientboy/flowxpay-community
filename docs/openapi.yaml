        - properties:
            market: { const: BR }
            currency: { const: BRL }
            method: { const: pix }
        - properties:
            market: { const: US }
            currency: { const: USD }
            method: { const: card }
        - properties:
            market: { const: IN }
            currency: { const: INR }
            method: { const: gateway }
